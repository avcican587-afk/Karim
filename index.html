<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #050508, #12081c, #1f0d2c);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    /* Arka plan yıldızları */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Romantik Karşılama Yazısı */
    .message {
      text-align: center;
      z-index: 100;
      position: absolute;
      padding: 35px 45px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 75, 75, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      animation: fadeInMsg 2s ease-out forwards;
      max-width: 85%;
      transition: opacity 1.5s ease;
    }

    @keyframes fadeInMsg {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      line-height: 1.4;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
    }

    .message p {
      font-size: 1.3rem;
      opacity: 0.95;
      letter-spacing: 1px;
      font-weight: bold;
      color: #ffb6c1;
    }

    /* Uçuşan Kalpler */
    .floating-heart {
      position: absolute;
      font-size: 28px;
      animation: flyUp 4s linear forwards;
      z-index: 50;
      user-select: none;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(100vh) scale(0.4);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Tek ve Büyük Büyüyen Gül Sahnesi */
    .single-growing-rose {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      transform: scale(0.2);
      animation: cinematicShow 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes cinematicShow {
      0% {
        transform: scale(0.2) translateY(80px);
        opacity: 0;
      }
      100% {
        transform: scale(1.6) translateY(0);
        opacity: 1;
      }
    }

    .rose-display {
      font-size: 90px;
      filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.85));
      user-select: none;
      transition: transform 0.5s ease;
    }
  </style>
</head>
<body>

  <!-- Yıldızlar -->
  <script>
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * window.innerWidth + 'px';
      star.style.top = Math.random() * window.innerHeight + 'px';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }
  </script>

  <!-- Romantik Yazı -->
  <div class="message" id="romanticMsg">
    <h1>Geriye dönüp baktığımda hayatımı bahara çevirdiğini görüyorum. Hayatıma kattığın tüm güzellikler için küçük bir teşekkür..🌹</h1>
    <p>SENİ ÇOK SEVİYORUMM. ❤️</p>
  </div>

  <script>
    // 1. Aşama: Yazı ekrandayken etrafta kalplerin uçuşması
    function startHeartsShow() {
      let heartCount = 0;
      const heartInterval = setInterval(() => {
        if (heartCount > 35) {
          clearInterval(heartInterval);
          return;
        }

        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.fontSize = (Math.random() * 25 + 20) + 'px';
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
        heartCount++;
      }, 100);
    }

    // 2. Aşama: Yazı kalkar ve ekranın tam ortasında tek bir gül sıfırdan fidan halinden açılışına kadar evrim geçirir
    function startSingleRoseEvolution() {
      startHeartsShow();

      // 5 saniye sonra yazı yumuşakça kaybolur
      setTimeout(() => {
        const msg = document.getElementById('romanticMsg');
        msg.style.opacity = '0';
        setTimeout(() => msg.remove(), 1500);
      }, 5000);

      // Yazı kaybolduktan hemen sonra ekranın ortasında tek gül doğar ve evrimleşir
      setTimeout(() => {
        const container = document.createElement('div');
        container.className = 'single-growing-rose';

        const roseEl = document.createElement('div');
        roseEl.className = 'rose-display';

        // Gönderdiğin gelişim şemasındaki gibi aşama aşama büyüme evreleri[cite: 7]
        // 🌱 (Tohum/Filiz) -> 🌿 (Yeşil yapraklı sap) -> 🌷 (Gonca) -> 🌹 (Tam açmış büyük kırmızı gül)
        const growthStages = ['🌱', '🌿', '🌷', '🌹'];
        
        roseEl.innerHTML = growthStages[0]; // İlk an: Filiz
        
        // Akıcı zaman ayarlı geçişler (Her aşama gerçek bir video gibi akar)
        setTimeout(() => { roseEl.innerHTML = growthStages[1]; }, 900);
        setTimeout(() => { roseEl.innerHTML = growthStages[2]; }, 1800);
        setTimeout(() => { 
          roseEl.innerHTML = growthStages[3]; 
          // Son açılış anında tatlı bir büyüme efekti
          roseEl.style.transform = 'scale(1.15)';
          setTimeout(() => roseEl.style.transform = 'scale(1)', 300);
        }, 2700);

        container.appendChild(roseEl);
        
        // Tam ekranın ortasına konumlandırılır
        container.style.left = (window.innerWidth / 2 - 45) + 'px';
        container.style.top = (window.innerHeight / 2 - 45) + 'px';

        document.body.appendChild(container);
      }, 6200);
    }

    // Sayfa yüklendikten 1 saniye sonra senaryo başlar
    window.onload = () => {
      setTimeout(startSingleRoseEvolution, 1000);
    };
  </script>

</body>
</html>
