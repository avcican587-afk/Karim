<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #050508, #12081c, #1f0d2c);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    /* Arka plan yıldızları */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Romantik Karşılama Yazısı (İlk aşamada kalıcı) */
    .message {
      text-align: center;
      z-index: 100;
      position: absolute;
      padding: 35px 45px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 75, 75, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      animation: fadeInMsg 2s ease-out forwards;
      max-width: 85%;
      transition: opacity 1.5s ease;
    }

    @keyframes fadeInMsg {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      line-height: 1.4;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
    }

    .message p {
      font-size: 1.3rem;
      opacity: 0.95;
      letter-spacing: 1px;
      font-weight: bold;
      color: #ffb6c1;
    }

    /* Uçuşan Kalpler (Yazı ekrandayken başlar) */
    .floating-heart {
      position: absolute;
      font-size: 28px;
      animation: flyUp 4s linear forwards;
      z-index: 50;
      user-select: none;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(100vh) scale(0.4);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Gerçekçi Kırmızı Gül Bahçesi Açılış Animasyonu */
    .garden-rose {
      position: absolute;
      font-size: 48px;
      animation: bloomRealRose 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 10;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
      user-select: none;
      opacity: 0;
    }

    @keyframes bloomRealRose {
      0% {
        transform: scale(0) translateY(60px) rotate(-25deg);
        opacity: 0;
      }
      70% {
        transform: scale(1.3) translateY(-10px) rotate(8deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0) rotate(0deg);
        opacity: 0.98;
      }
    }
  </style>
</head>
<body>

  <!-- Yıldızlar -->
  <script>
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * window.innerWidth + 'px';
      star.style.top = Math.random() * window.innerHeight + 'px';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }
  </script>

  <!-- Romantik Yazı -->
  <div class="message" id="romanticMsg">
    <h1>Geriye dönüp baktığımda hayatımı bahara çevirdiğini görüyorum. Hayatıma kattığın tüm güzellikler için küçük bir teşekkür..🌹</h1>
    <p>SENİ ÇOK SEVİYORUMM. ❤️</p>
  </div>

  <script>
    // 1. Aşama: Yazı ekranda dururken kalplerin açılması ve tüm ekranı sarması
    function startHeartsShow() {
      let heartCount = 0;
      const heartInterval = setInterval(() => {
        if (heartCount > 40) {
          clearInterval(heartInterval);
          return;
        }

        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.fontSize = (Math.random() * 25 + 20) + 'px';
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
        heartCount++;
      }, 100);
    }

    // 2. Aşama: Kalpler ve yazı geçiş yapıp, ekranı gerçekçi kırmızı gül bahçesine bırakır
    function startRoseGardenCinematic() {
      // Önce kalpler başlasın (Yazı silinmeden ekranda dans ederler)
      startHeartsShow();

      // 5 saniye sonra yazı ve kalan kalpler yumuşakça kaybolur
      setTimeout(() => {
        const msg = document.getElementById('romanticMsg');
        msg.style.opacity = '0';
        setTimeout(() => msg.remove(), 1500);
      }, 5000);

      // Yazı gittikten hemen sonra muazzam gül bahçesi açılış animasyonu patlar
      setTimeout(() => {
        let roseCount = 0;
        const roseInterval = setInterval(() => {
          if (roseCount > 60) { // Onlarca gerçekçi gül ekranı tamamen sarar
            clearInterval(roseInterval);
            return;
          }

          const rose = document.createElement('div');
          rose.className = 'garden-rose';
          // En gerçekçi gül ve bahçe görselleri kombinasyonu
          const roseTypes = ['🌹', '🌹', '🌺', '🌹'];
          rose.innerHTML = roseTypes[Math.floor(Math.random() * roseTypes.length)];
          
          const posX = Math.random() * (window.innerWidth - 70);
          const posY = Math.random() * (window.innerHeight - 70);
          
          rose.style.left = posX + 'px';
          rose.style.top = posY + 'px';
          rose.style.fontSize = (Math.random() * 40 + 35) + 'px'; // Büyük ve etkileyici

          document.body.appendChild(rose);
          roseCount++;
        }, 80);
      }, 6200);
    }

    // Sayfa yüklendikten 1 saniye sonra bu romantik senaryo başlar
    window.onload = () => {
      setTimeout(startRoseGardenCinematic, 1000);
    };
  </script>

</body>
</html>
