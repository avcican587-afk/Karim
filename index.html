<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #050508, #12081c, #1f0d2c);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    /* Arka plan yıldızları */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Romantik Karşılama Yazısı */
    .message {
      text-align: center;
      z-index: 100;
      position: absolute;
      padding: 30px 40px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 105, 180, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      animation: fadeInMsg 2s ease-out forwards;
      max-width: 80%;
    }

    @keyframes fadeInMsg {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      background: linear-gradient(45deg, #ff758c, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
    }

    .message p {
      font-size: 1.2rem;
      opacity: 0.9;
      letter-spacing: 1px;
    }

    /* Uçuşan Kalpler */
    .floating-heart {
      position: absolute;
      font-size: 24px;
      animation: flyUp 4s linear forwards;
      z-index: 50;
      user-select: none;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) scale(1.4);
        opacity: 0;
      }
    }

    /* Açılan Güller ve Çiçekler */
    .growing-flower {
      position: absolute;
      transform-origin: bottom center;
      animation: bloomVideo 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 10;
      filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.6));
    }

    @keyframes bloomVideo {
      0% {
        transform: scale(0) translateY(50px) rotate(-10deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.2) translateY(-10px) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0) rotate(0deg);
        opacity: 0.95;
      }
    }
  </style>
</head>
<body>

  <!-- Yıldızlar -->
  <script>
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * window.innerWidth + 'px';
      star.style.top = Math.random() * window.innerHeight + 'px';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }
  </script>

  <!-- Romantik Yazı (Burayı dilediğin gibi değiştirebilirsin) -->
  <div class="message" id="romanticMsg">
    <h1>Geriye dönüp baktığımda hayatımı bahara çevirdiğini görüyorum. Hayatıma kattığın tüm güzellikler için küçük bir teşekkür..🌹</h1>
    <p>SENİ ÇOK SEVİYORUMM. ❤️ </p>
  </div>

  <script>
    const flowers = ['🌹', '🌷', '🌸', '🌺', '💐', '🌻'];

    // 1. Aşama: Linke tıklandığı an uçuşan kalpler başlasın
    function startHearts() {
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.innerHTML = '❤️';
          heart.style.left = Math.random() * window.innerWidth + 'px';
          heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 4000);
        }, i * 150);
      }
    }

    // 2. Aşama: Yazı belirdikten sonra ekranın her yerinde güller patlasın (Video gibi)
    function startGardenVideo() {
      // Önce kalpler başlasın
      startHearts();

      // 3 saniye sonra yazı yavaşça kaybolsun ki bahçe tam ekran görünsün
      setTimeout(() => {
        const msg = document.getElementById('romanticMsg');
        msg.style.transition = 'opacity 1.5s ease';
        msg.style.opacity = '0';
        setTimeout(() => msg.remove(), 1500);
      }, 3500);

      // Ardından ekrana peş peşe onlarca gül fidesi/çiçek açılsın
      let flowerCount = 0;
      const interval = setInterval(() => {
        if (flowerCount > 45) {
          clearInterval(interval);
          return;
        }

        const flower = document.createElement('div');
        flower.className = 'growing-flower';
        flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
        
        // Ekranın rastgele yerlerine dağılsın
        const posX = Math.random() * (window.innerWidth - 60);
        const posY = Math.random() * (window.innerHeight - 60);
        
        flower.style.left = posX + 'px';
        flower.style.top = posY + 'px';
        flower.style.fontSize = (Math.random() * 30 + 35) + 'px'; // Büyük ve belirgin

        document.body.appendChild(flower);
        flowerCount++;
      }, 120); // Her 0.12 saniyede bir yeni bir gül açar
    }

    // Sayfa açıldıktan 1 saniye sonra bu sihirli şölen otomatik başlar
    window.onload = () => {
      setTimeout(startGardenVideo, 1000);
    };
  </script>

</body>
</html>
