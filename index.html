<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #050508, #12081c, #1f0d2c);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    /* Arka plan yıldızları */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Romantik Karşılama Yazısı */
    .message {
      text-align: center;
      z-index: 100;
      position: absolute;
      padding: 30px 40px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 75, 75, 0.4);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      animation: fadeInMsg 2s ease-out forwards;
      max-width: 85%;
    }

    @keyframes fadeInMsg {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      line-height: 1.4;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
    }

    .message p {
      font-size: 1.3rem;
      opacity: 0.95;
      letter-spacing: 1px;
      font-weight: bold;
    }

    /* Uçuşan Kalpler */
    .floating-heart {
      position: absolute;
      font-size: 26px;
      animation: flyUp 4s linear forwards;
      z-index: 50;
      user-select: none;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Kırmızı Güllerin Belirme Efekti */
    .red-rose {
      position: absolute;
      font-size: 42px;
      animation: bloomRedRose 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 10;
      filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.7));
      user-select: none;
    }

    @keyframes bloomRedRose {
      0% {
        transform: scale(0) translateY(40px) rotate(-15deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.25) translateY(-5deg) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0) rotate(0deg);
        opacity: 0.95;
      }
    }
  </style>
</head>
<body>

  <!-- Yıldızlar -->
  <script>
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * window.innerWidth + 'px';
      star.style.top = Math.random() * window.innerHeight + 'px';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }
  </script>

  <!-- Romantik Yazı -->
  <div class="message" id="romanticMsg">
    <h1>Geriye dönüp baktığımda hayatımı bahara çevirdiğini görüyorum. Hayatıma kattığın tüm güzellikler için küçük bir teşekkür..🌹</h1>
    <p>SENİ ÇOK SEVİYORUMM. ❤️</p>
  </div>

  <script>
    // 1. Aşama: Uçuşan kalpler
    function startHearts() {
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.innerHTML = '❤️';
          heart.style.left = Math.random() * window.innerWidth + 'px';
          heart.style.fontSize = (Math.random() * 22 + 20) + 'px';
          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 4000);
        }, i * 130);
      }
    }

    // 2. Aşama: Kalpler bittikten sonra ekranı kaplayan kırmızı güller
    function startRedRosesGarden() {
      startHearts();

      // 4.5 saniye sonra yazı yavaşça kaybolur (Okuması için biraz daha süre tanındı)
      setTimeout(() => {
        const msg = document.getElementById('romanticMsg');
        msg.style.transition = 'opacity 1.5s ease';
        msg.style.opacity = '0';
        setTimeout(() => msg.remove(), 1500);
      }, 4500);

      // Yazı gittikten sonra ekranda peş peşe kırmızı güller açmaya başlar
      setTimeout(() => {
        let roseCount = 0;
        const interval = setInterval(() => {
          if (roseCount > 50) { 
            clearInterval(interval);
            return;
          }

          const rose = document.createElement('div');
          rose.className = 'red-rose';
          rose.innerHTML = '🌹'; 
          
          const posX = Math.random() * (window.innerWidth - 60);
          const posY = Math.random() * (window.innerHeight - 60);
          
          rose.style.left = posX + 'px';
          rose.style.top = posY + 'px';
          rose.style.fontSize = (Math.random() * 35 + 35) + 'px';

          document.body.appendChild(rose);
          roseCount++;
        }, 100);
      }, 5500);
    }

    // Sayfa açıldıktan 1 saniye sonra şölen otomatik başlar
    window.onload = () => {
      setTimeout(startRedRosesGarden, 1000);
    };
  </script>

</body>
</html>
